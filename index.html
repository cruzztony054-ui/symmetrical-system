
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T-WORLD</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif}
header{background:#172338;padding:18px;text-align:center;font-size:24px;font-weight:bold;color:#38bdf8}
.container{max-width:650px;margin:auto;padding:15px}
.panel{background:#1b2940;padding:17px;border-radius:12px;margin-top:15px}
input,button{width:100%;padding:13px;margin:7px 0;border:0;border-radius:7px;font-size:15px}
input{background:#eef2f7;color:#111}
button{background:#0284c7;color:white;font-weight:bold;cursor:pointer}
.smallbtn{width:auto;padding:9px 13px;background:#475569}
.hidden{display:none}
#message,#appMessage{margin-top:10px;color:#fbbf24}
.person{background:#263750;padding:13px;border-radius:8px;margin:8px 0;cursor:pointer}
.person strong{display:block}
.status{font-size:12px;color:#4ade80;margin-top:5px}
.offline{color:#94a3b8}
.unread{color:#38bdf8;font-weight:bold}
#chatBox{height:350px;overflow-y:auto;background:#101827;border-radius:8px;padding:12px;margin:12px 0}
.msg{max-width:85%;padding:10px;border-radius:10px;margin:8px 0;overflow-wrap:anywhere}
.sent{background:#075985;margin-left:auto}
.received{background:#334155}
.msgtime{font-size:10px;color:#cbd5e1;margin-top:5px}
.chatinput{display:flex;gap:7px}
.chatinput input{flex:1;min-width:0}
.chatinput button{width:85px}
#typing{font-size:12px;color:#38bdf8;min-height:18px}
</style>
</head>

<body>
<header>🌍 T-WORLD</header>

<div class="container">

<div id="authPanel" class="panel">
<h2>Welcome to T-WORLD</h2>

<h3>Login</h3>
<input id="loginEmail" type="email" placeholder="Email address">
<input id="loginPassword" type="password" placeholder="Password">
<button onclick="login()">Login</button>

<hr>

<h3>Create account</h3>
<input id="fullName" placeholder="Full name">
<input id="username" placeholder="Username">
<input id="signupEmail" type="email" placeholder="Email address">
<input id="signupPassword" type="password" placeholder="Create password">
<button onclick="register()">Create account</button>

<div id="message"></div>
</div>

<div id="appPanel" class="hidden">

<div class="panel">
<div id="myName">Welcome</div>
<button class="smallbtn" onclick="loadUsers()">Refresh people</button>
<button class="smallbtn" onclick="logout()">Logout</button>
</div>

<div class="panel">
<h3>People</h3>
<div id="users">Loading people...</div>
</div>

<div id="chatPanel" class="panel hidden">
<div id="chatTitle">Chat</div>
<div id="typing"></div>
<div id="chatBox"></div>
<div class="chatinput">
<input id="chatInput" placeholder="Write a message..." autocomplete="off">
<button onclick="sendMessage()">Send</button>
</div>
</div>

<div id="appMessage"></div>
</div>
</div>

<script>
/* SUPABASE CONNECTION */

const SUPABASE_URL = "https://szlsitwlvlcohcodhazu.supabase.co";
const SUPABASE_KEY = "sb_publishable_4t9X38e8lhJuwTB3KpaEfg_jfYwLcPS";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* APP VARIABLES */

let currentUser = null;
let myProfile = null;
let selectedUser = null;
let messageChannel = null;
let presenceChannel = null;
let typingChannel = null;
let typingTimer = null;
let heartbeatTimer = null;
let onlineUsers = new Set();
let typingTimeout = null;

function el(id){
  return document.getElementById(id);
}

function showMessage(message,error=false){
  el("message").textContent = message;
  el("message").style.color = error ? "#f87171" : "#4ade80";
}

function appMessage(message){
  el("appMessage").textContent = message;
}

/* REGISTER */

async function register(){
  try{
    const fullName = el("fullName").value.trim();
    const username = el("username").value.trim().toLowerCase();
    const email = el("signupEmail").value.trim();
    const password = el("signupPassword").value;

    if(!fullName || !username || !email || !password){
      return showMessage("Please complete all fields.",true);
    }

    if(password.length < 6){
      return showMessage("Password must contain at least 6 characters.",true);
    }

    showMessage("Creating your account...");

    const {data,error} = await db.auth.signUp({
      email,
      password,
      options:{
        data:{
          full_name:fullName,
          username:username
        }
      }
    });

    if(error) throw error;

    if(data.user && data.session){
      currentUser = data.user;

      const {error:profileError} = await db
        .from("profiles")
        .upsert({
          id:currentUser.id,
          full_name:fullName,
          username:username,
          last_seen:new Date().toISOString()
        });

      if(profileError) throw profileError;

      await startApp();
    }else{
      showMessage("Account created! Check your email to confirm your account, then log in.");
    }

  }catch(error){
    showMessage(error.message,true);
  }
}

/* LOGIN */

async function login(){
  try{
    const email = el("loginEmail").value.trim();
    const password = el("loginPassword").value;

    if(!email || !password){
      return showMessage("Enter your email and password.",true);
    }

    showMessage("Logging in...");

    const {data,error} = await db.auth.signInWithPassword({
      email,
      password
    });

    if(error) throw error;

    currentUser = data.user;
    await startApp();

  }catch(error){
    showMessage(error.message,true);
  }
}

/* START APP */

async function startApp(){
  el("authPanel").classList.add("hidden");
  el("appPanel").classList.remove("hidden");

  const {data,error} = await db
    .from("profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(error) throw error;

  if(!data){
    const name = currentUser.user_metadata.full_name || "User";
    const username = currentUser.user_metadata.username || currentUser.email.split("@")[0];

    const {data:newProfile,error:insertError} = await db
      .from("profiles")
      .insert({
        id:currentUser.id,
        full_name:name,
        username:username,
        last_seen:new Date().toISOString()
      })
      .select()
      .single();

    if(insertError) throw insertError;
    myProfile = newProfile;
  }else{
    myProfile = data;
  }

  el("myName").textContent =
    "Welcome, " + (myProfile.full_name || myProfile.username);

  await loadUsers();
  startPresence();
  startMessageUpdates();
  startHeartbeat();
}

/* LOAD PEOPLE */

async function loadUsers(){
  if(!currentUser) return;

  el("users").textContent = "Loading people...";

  const {data:profiles,error} = await db
    .from("profiles")
    .select("id,full_name,username,last_seen")
    .neq("id",currentUser.id)
    .order("username");

  if(error){
    el("users").textContent = error.message;
    return;
  }

  const {data:unread,error:unreadError} = await db
    .from("messages")
    .select("sender_id")
    .eq("receiver_id",currentUser.id)
    .is("read_at",null);

  const counts = {};

  if(!unreadError){
    unread.forEach(message=>{
      counts[message.sender_id] =
        (counts[message.sender_id] || 0) + 1;
    });
  }

  el("users").innerHTML = "";

  if(!profiles.length){
    el("users").textContent = "No other users yet.";
    return;
  }

  profiles.forEach(person=>{
    const div = document.createElement("div");
    div.className = "person";

    const name = document.createElement("strong");
    name.textContent = person.full_name || person.username || "User";

    const username = document.createElement("div");
    username.textContent = "@" + (person.username || "user");

    const status = document.createElement("div");
    const online = onlineUsers.has(person.id);

    status.className = online ? "status" : "status offline";

    if(online){
      status.textContent = "● Online";
    }else{
      status.textContent = "● Offline";
      if(person.last_seen){
        status.textContent += " · Last seen " +
          new Date(person.last_seen).toLocaleString();
      }
    }

    div.appendChild(name);
    div.appendChild(username);
    div.appendChild(status);

    if(counts[person.id]){
      const unreadLabel = document.createElement("div");
      unreadLabel.className = "unread";
      unreadLabel.textContent = counts[person.id] + " unread message(s)";
      div.appendChild(unreadLabel);
    }

    div.onclick = ()=>openChat(person);
    el("users").appendChild(div);
  });
}

/* OPEN CHAT */

async function openChat(person){
  selectedUser = person;

  el("chatPanel").classList.remove("hidden");
  el("chatTitle").textContent =
    person.full_name || person.username || "Chat";

  el("chatBox").textContent = "Loading messages...";

  await loadMessages();
  await markMessagesRead();
  startTypingChannel();

  el("chatPanel").scrollIntoView({behavior:"smooth"});
}

/* LOAD MESSAGES */

async function loadMessages(){
  if(!selectedUser || !currentUser) return;

  const {data,error} = await db
    .from("messages")
    .select("*")
    .or(
      "and(sender_id.eq."+currentUser.id+
      ",receiver_id.eq."+selectedUser.id+
      "),and(sender_id.eq."+selectedUser.id+
      ",receiver_id.eq."+currentUser.id+")"
    )
    .order("created_at",{ascending:true});

  if(error){
    el("chatBox").textContent = error.message;
    return;
  }

  el("chatBox").innerHTML = "";

  data.forEach(message=>{
    const div = document.createElement("div");
    div.className = "msg " +
      (message.sender_id === currentUser.id ? "sent" : "received");

    const content = document.createElement("div");
    content.textContent = message.content;

    const time = document.createElement("div");
    time.className = "msgtime";
    time.textContent = new Date(message.created_at).toLocaleString();

    if(message.sender_id === currentUser.id && message.read_at){
      time.textContent += " · Seen";
    }

    div.appendChild(content);
    div.appendChild(time);
    el("chatBox").appendChild(div);
  });

  el("chatBox").scrollTop = el("chatBox").scrollHeight;
}

/* SEND MESSAGE */

async function sendMessage(){
  try{
    if(!selectedUser) return;

    const content = el("chatInput").value.trim();
    if(!content) return;

    el("chatInput").value = "";

    const {error} = await db
      .from("messages")
      .insert({
        sender_id:currentUser.id,
        receiver_id:selectedUser.id,
        content:content
      });

    if(error) throw error;

    await loadMessages();

  }catch(error){
    appMessage(error.message);
  }
}

/* ENTER TO SEND */

el("chatInput").addEventListener("keydown",function(event){
  if(event.key === "Enter"){
    sendMessage();
  }
});

/* MARK MESSAGES AS READ */

async function markMessagesRead(){
  if(!selectedUser || !currentUser) return;

  const {error} = await db
    .from("messages")
    .update({read_at:new Date().toISOString()})
    .eq("sender_id",selectedUser.id)
    .eq("receiver_id",currentUser.id)
    .is("read_at",null);

  if(error){
    appMessage("Read status: " + error.message);
  }

  await loadUsers();
}

/* REALTIME MESSAGE UPDATES */

function startMessageUpdates(){
  if(messageChannel){
    db.removeChannel(messageChannel);
  }

  messageChannel = db
    .channel("t-world-messages-"+currentUser.id)
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"messages"
      },
      async payload=>{
        const msg = payload.new || payload.old;

        if(!msg) return;

        const involved =
          msg.sender_id === currentUser.id ||
          msg.receiver_id === currentUser.id;

        if(!involved) return;

        await loadUsers();

        if(
          selectedUser &&
          (
            msg.sender_id === selectedUser.id ||
            msg.receiver_id === selectedUser.id
          )
        ){
          await loadMessages();

          if(msg.sender_id === selectedUser.id){
            await markMessagesRead();
          }
        }
      }
    )
    .subscribe();
}

/* ONLINE PRESENCE */

function startPresence(){
  if(presenceChannel){
    db.removeChannel(presenceChannel);
  }

  presenceChannel = db.channel("t-world-online");

  presenceChannel
    .on("presence",{event:"sync"},()=>{
      onlineUsers = new Set();

      const state = presenceChannel.presenceState();

      Object.keys(state).forEach(key=>{
        state[key].forEach(user=>{
          if(user.user_id){
            onlineUsers.add(user.user_id);
          }
        });
      });

      loadUsers();
    })
    .subscribe(async status=>{
      if(status === "SUBSCRIBED"){
        await presenceChannel.track({
          user_id:currentUser.id,
          online_at:new Date().toISOString()
        });
      }
    });
}

/* LAST SEEN HEARTBEAT */

function startHeartbeat(){
  if(heartbeatTimer) clearInterval(heartbeatTimer);

  const updateLastSeen = async()=>{
    if(!currentUser) return;

    await db
      .from("profiles")
      .update({last_seen:new Date().toISOString()})
      .eq("id",currentUser.id);
  };

  updateLastSeen();

  heartbeatTimer = setInterval(updateLastSeen,60000);
}

/* TYPING INDICATOR */

function startTypingChannel(){
  if(typingChannel){
    db.removeChannel(typingChannel);
  }

  const ids = [currentUser.id,selectedUser.id].sort();
  const channelName = "typing-"+ids.join("-");

  typingChannel = db.channel(channelName);

  typingChannel
    .on("broadcast",{event:"typing"},payload=>{
      if(payload.payload.user_id !== currentUser.id){
        el("typing").textContent =
          (selectedUser.full_name || selectedUser.username) +
          " is typing...";
        clearTimeout(typingTimeout);

        typingTimeout = setTimeout(()=>{
          el("typing").textContent = "";
        },2500);
      }
    })
    .subscribe();
}

el("chatInput").addEventListener("input",async()=>{
  if(!typingChannel || !currentUser) return;

  await typingChannel.send({
    type:"broadcast",
    event:"typing",
    payload:{user_id:currentUser.id}
  });
});

/* LOGOUT */

async function logout(){
  if(heartbeatTimer) clearInterval(heartbeatTimer);
  if(typingTimeout) clearTimeout(typingTimeout);

  if(messageChannel) await db.removeChannel(messageChannel);
  if(presenceChannel) await db.removeChannel(presenceChannel);
  if(typingChannel) await db.removeChannel(typingChannel);

  await db.auth.signOut();

  currentUser = null;
  myProfile = null;
  selectedUser = null;
  onlineUsers.clear();

  el("appPanel").classList.add("hidden");
  el("authPanel").classList.remove("hidden");
  el("chatPanel").classList.add("hidden");

  showMessage("You have logged out.");
}

/* RESTORE SESSION */

async function restoreSession(){
  const {data,error} = await db.auth.getSession();

  if(error){
    showMessage(error.message,true);
    return;
  }

  if(data.session){
    currentUser = data.session.user;

    try{
      await startApp();
    }catch(error){
      appMessage(error.message);
    }
  }
}

restoreSession();

</script>
</body>
</html>
