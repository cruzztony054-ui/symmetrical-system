
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T-WORLD</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif}
header{background:#172338;padding:18px;text-align:center;font-size:25px;font-weight:bold;color:#38bdf8}
.container{max-width:650px;margin:auto;padding:14px}
.panel{background:#1b2940;padding:15px;border-radius:12px;margin:12px 0}
input,button{padding:13px;border:0;border-radius:7px;font-size:15px;margin:6px 0}
input{background:#eef2f7;color:#111;width:100%}
button{background:#0284c7;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.hidden{display:none}
.small{font-size:12px;color:#94a3b8}
.person{display:flex;align-items:center;gap:12px;background:#263750;padding:12px;border-radius:9px;margin:8px 0;cursor:pointer}
.person-info{flex:1}
.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#475569}
.my-avatar{width:85px;height:85px;border-radius:50%;object-fit:cover;background:#475569}
.chat-head{display:flex;align-items:center;gap:10px}
#chatBox{height:350px;overflow-y:auto;background:#101827;padding:10px;border-radius:9px;margin:12px 0}
.msg{padding:10px;border-radius:10px;margin:8px 0;max-width:85%;overflow-wrap:anywhere}
.sent{background:#075985;margin-left:auto}
.received{background:#334155}
.msgtime{font-size:10px;color:#cbd5e1;margin-top:5px}
.chatinput{display:flex;gap:6px}
.chatinput input{flex:1;min-width:0}
.chatinput button{width:85px}
.voice-controls{display:flex;gap:8px}
.voice-controls button{flex:1}
audio{width:100%;max-width:250px;margin-top:7px}
#typing{color:#38bdf8;font-size:12px;min-height:18px}
#message,#appMessage{color:#fbbf24;margin:8px 0}
.online{color:#4ade80;font-size:12px}
.offline{color:#94a3b8;font-size:12px}
</style>
</head>
<body>

<header>🌍 T-WORLD</header>

<div class="container">

<div id="authPanel" class="panel">
<h2>Welcome to T-WORLD</h2>
<h3>Login</h3>
<input id="loginEmail" type="email" placeholder="Email address">
<input id="loginPassword" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<hr>
<h3>Create account</h3>
<input id="fullName" placeholder="Full name">
<input id="username" placeholder="Username">
<input id="signupEmail" type="email" placeholder="Email address">
<input id="signupPassword" type="password" placeholder="Create password">
<button onclick="register()">Create account</button>
<div id="message"></div>
</div>

<div id="appPanel" class="hidden">

<div class="panel" style="text-align:center">
<h3>My Profile</h3>
<img id="myAvatar" class="my-avatar" alt="Profile picture">
<div id="myName"></div>
<input id="avatarFile" type="file" accept="image/*">
<button onclick="uploadAvatar()">Upload profile picture</button>
<button onclick="loadUsers()">Refresh people</button>
<button onclick="logout()">Logout</button>
</div>

<div class="panel">
<h3>People</h3>
<div id="users">Loading people...</div>
</div>

<div id="chatPanel" class="panel hidden">
<div class="chat-head">
<img id="chatAvatar" class="avatar" alt="Profile picture">
<strong id="chatTitle">Chat</strong>
</div>
<div id="typing"></div>
<div id="chatBox"></div>

<div class="chatinput">
<input id="chatInput" placeholder="Write a message..." autocomplete="off">
<button onclick="sendMessage()">Send</button>
</div>

<hr>
<h3>🎙️ Voice messages</h3>
<div class="voice-controls">
<button id="recordButton" onclick="startRecording()">🎙️ Record</button>
<button id="stopButton" onclick="stopRecording()" disabled>⏹ Stop</button>
</div>
<div id="recordStatus" class="small">Tap Record to start.</div>
</div>

<div id="appMessage"></div>
</div>
</div>

<script>
const SUPABASE_URL="https://szlsitwlvlcohcodhazu.supabase.co";
const SUPABASE_KEY="sb_publishable_4t9X38e8lhJuwTB3KpaEfg_jfYwLcPS";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null;
let myProfile=null;
let selectedUser=null;
let mediaRecorder=null;
let audioChunks=[];
let recordingStream=null;
let presenceChannel=null;
let messageChannel=null;
let typingChannel=null;
let onlineUsers=new Set();
let typingTimer=null;
let heartbeat=null;

function el(id){return document.getElementById(id)}
function say(message){el("appMessage").textContent=message}
function authMessage(message){el("message").textContent=message}
function avatar(element,url){
 element.src=url||"";
 element.onerror=()=>element.removeAttribute("src");
}

async function register(){
 try{
  const full_name=el("fullName").value.trim();
  const username=el("username").value.trim().toLowerCase();
  const email=el("signupEmail").value.trim();
  const password=el("signupPassword").value;
  if(!full_name||!username||!email||!password)
   return authMessage("Complete all fields.");
  if(password.length<6)return authMessage("Password must be at least 6 characters.");

  authMessage("Creating account...");
  const {data,error}=await db.auth.signUp({
   email,password,options:{data:{full_name,username}}
  });
  if(error)throw error;

  if(!data.session){
   authMessage("Account created. Check your email to confirm, then log in.");
   return;
  }
  currentUser=data.user;
  const {error:profileError}=await db.from("profiles").upsert({
   id:currentUser.id,full_name,username,last_seen:new Date().toISOString()
  });
  if(profileError)throw profileError;
  await startApp();
 }catch(e){authMessage(e.message)}
}

async function login(){
 try{
  authMessage("Logging in...");
  const {data,error}=await db.auth.signInWithPassword({
   email:el("loginEmail").value.trim(),
   password:el("loginPassword").value
  });
  if(error)throw error;
  currentUser=data.user;
  await startApp();
 }catch(e){authMessage(e.message)}
}

async function startApp(){
 el("authPanel").classList.add("hidden");
 el("appPanel").classList.remove("hidden");

 const {data,error}=await db.from("profiles").select("*")
  .eq("id",currentUser.id).maybeSingle();
 if(error)throw error;

 if(!data){
  const {data:newData,error:newError}=await db.from("profiles").insert({
   id:currentUser.id,
   full_name:currentUser.user_metadata.full_name||"User",
   username:currentUser.user_metadata.username||currentUser.email.split("@")[0],
   last_seen:new Date().toISOString()
  }).select().single();
  if(newError)throw newError;
  myProfile=newData;
 }else myProfile=data;

 el("myName").textContent="Welcome, "+(myProfile.full_name||myProfile.username);
 avatar(el("myAvatar"),myProfile.avatar_url);

 await loadUsers();
 startPresence();
 startMessagesRealtime();
 startHeartbeat();
}

async function uploadAvatar(){
 try{
  const file=el("avatarFile").files[0];
  if(!file)return say("Choose a picture first.");
  if(!file.type.startsWith("image/"))return say("Choose an image.");
  if(file.size>5*1024*1024)return say("Image must be under 5 MB.");

  say("Uploading picture...");
  const ext=(file.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"");
  const path=currentUser.id+"/"+Date.now()+"."+(ext||"jpg");

  const {error:uploadError}=await db.storage.from("avatars").upload(path,file,{
   contentType:file.type,upsert:false
  });
  if(uploadError)throw uploadError;

  const {data}=db.storage.from("avatars").getPublicUrl(path);
  const {error:updateError}=await db.from("profiles")
   .update({avatar_url:data.publicUrl}).eq("id",currentUser.id);
  if(updateError)throw updateError;

  myProfile.avatar_url=data.publicUrl;
  avatar(el("myAvatar"),data.publicUrl);
  await loadUsers();
  say("Profile picture updated!");
 }catch(e){say("Picture error: "+e.message)}
}

async function loadUsers(){
 if(!currentUser)return;
 el("users").textContent="Loading...";
 const {data:people,error}=await db.from("profiles")
  .select("id,full_name,username,last_seen,avatar_url")
  .neq("id",currentUser.id).order("username");
 if(error){el("users").textContent=error.message;return}

 const {data:unread}=await db.from("messages")
  .select("sender_id").eq("receiver_id",currentUser.id).is("read_at",null);
 const counts={};
 (unread||[]).forEach(m=>counts[m.sender_id]=(counts[m.sender_id]||0)+1);

 el("users").innerHTML="";
 if(!people.length){el("users").textContent="No other users yet.";return}

 people.forEach(p=>{
  const item=document.createElement("div");
  item.className="person";
  const img=document.createElement("img");
  img.className="avatar";
  img.alt="Profile picture";
  avatar(img,p.avatar_url);
  const info=document.createElement("div");
  info.className="person-info";
  const name=document.createElement("strong");
  name.textContent=p.full_name||p.username;
  const username=document.createElement("div");
  username.textContent="@"+(p.username||"user");
  const status=document.createElement("div");
  status.className=onlineUsers.has(p.id)?"online":"offline";
  status.textContent=onlineUsers.has(p.id)?"● Online":
   "● Offline"+(p.last_seen?" · Last seen "+new Date(p.last_seen).toLocaleString():"");
  info.append(name,username,status);
  if(counts[p.id]){
   const count=document.createElement("div");
   count.className="online";
   count.textContent=counts[p.id]+" unread message(s)";
   info.appendChild(count);
  }
  item.append(img,info);
  item.onclick=()=>openChat(p);
  el("users").appendChild(item);
 });
}

async function openChat(person){
 selectedUser=person;
 el("chatPanel").classList.remove("hidden");
 el("chatTitle").textContent=person.full_name||person.username;
 avatar(el("chatAvatar"),person.avatar_url);
 el("chatBox").textContent="Loading messages...";
 await loadMessages();
 await markMessagesRead();
 startTyping();
}

async function loadMessages(){
 if(!selectedUser)return;
 const {data,error}=await db.from("messages").select("*")
  .or("and(sender_id.eq."+currentUser.id+",receiver_id.eq."+selectedUser.id+
   "),and(sender_id.eq."+selectedUser.id+",receiver_id.eq."+currentUser.id+")")
  .order("created_at",{ascending:true});
 if(error){el("chatBox").textContent=error.message;return}

 el("chatBox").innerHTML="";
 for(const m of data||[]){
  const div=document.createElement("div");
  div.className="msg "+(m.sender_id===currentUser.id?"sent":"received");

  if(m.message_type==="audio"&&m.audio_url){
   const label=document.createElement("div");
   label.textContent="🎙️ Voice message";
   div.appendChild(label);

   const {data:urlData,error:urlError}=await db.storage
    .from("voice-messages").createSignedUrl(m.audio_url,3600);
   if(!urlError&&urlData){
    const player=document.createElement("audio");
    player.controls=true;
    player.src=urlData.signedUrl;
    div.appendChild(player);
   }else{
    const unavailable=document.createElement("div");
    unavailable.textContent="Audio unavailable";
    div.appendChild(unavailable);
   }
  }else{
   const content=document.createElement("div");
   content.textContent=m.content||"";
   div.appendChild(content);
  }

  const time=document.createElement("div");
  time.className="msgtime";
  time.textContent=new Date(m.created_at).toLocaleString();
  if(m.sender_id===currentUser.id&&m.read_at)time.textContent+=" · Seen";
  div.appendChild(time);
  el("chatBox").appendChild(div);
 }
 el("chatBox").scrollTop=el("chatBox").scrollHeight;
}

async function sendMessage(){
 const content=el("chatInput").value.trim();
 if(!content||!selectedUser)return;
 const {error}=await db.from("messages").insert({
  sender_id:currentUser.id,
  receiver_id:selectedUser.id,
  content,
  message_type:"text"
 });
 if(error){say(error.message);return}
 el("chatInput").value="";
 await loadMessages();
 await loadUsers();
}

async function markMessagesRead(){
 if(!selectedUser)return;
 await db.from("messages").update({read_at:new Date().toISOString()})
  .eq("sender_id",selectedUser.id)
  .eq("receiver_id",currentUser.id)
  .is("read_at",null);
 await loadMessages();
}

async function startRecording(){
 try{
  if(!selectedUser)return say("Open a chat first.");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
   return say("Microphone recording is not supported here. Open T-WORLD in Chrome.");

  recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});
  let options={};
  if(MediaRecorder.isTypeSupported("audio/webm;codecs=opus"))
   options.mimeType="audio/webm;codecs=opus";

  mediaRecorder=new MediaRecorder(recordingStream,options);
  audioChunks=[];
  mediaRecorder.ondataavailable=e=>{
   if(e.data&&e.data.size>0)audioChunks.push(e.data);
  };
  mediaRecorder.onstop=uploadVoiceMessage;
  mediaRecorder.start();

  el("recordButton").disabled=true;
  el("stopButton").disabled=false;
  el("recordStatus").textContent="Recording... tap Stop when finished.";
 }catch(e){
  say("Microphone error: "+e.message);
 }
}

function stopRecording(){
 if(mediaRecorder&&mediaRecorder.state==="recording"){
  mediaRecorder.stop();
  if(recordingStream)recordingStream.getTracks().forEach(t=>t.stop());
  el("stopButton").disabled=true;
  el("recordStatus").textContent="Preparing your voice message...";
 }
}

async function uploadVoiceMessage(){
 try{
  const type=mediaRecorder.mimeType||"audio/webm";
  const blob=new Blob(audioChunks,{type});
  if(!blob.size)throw new Error("No audio was recorded.");

  const path=currentUser.id+"/"+selectedUser.id+"/"+Date.now()+".webm";
  const {error:uploadError}=await db.storage
   .from("voice-messages").upload(path,blob,{
    contentType:type,upsert:false
   });
  if(uploadError)throw uploadError;

  const {error:insertError}=await db.from("messages").insert({
   sender_id:currentUser.id,
   receiver_id:selectedUser.id,
   content:"",
   audio_url:path,
   message_type:"audio"
  });
  if(insertError)throw insertError;

  el("recordStatus").textContent="Voice message sent!";
  await loadMessages();
  await loadUsers();
 }catch(e){
  el("recordStatus").textContent="Voice message error: "+e.message;
 }finally{
  el("recordButton").disabled=false;
  el("stopButton").disabled=true;
  if(recordingStream)recordingStream.getTracks().forEach(t=>t.stop());
  recordingStream=null;
 }
}

function startMessagesRealtime(){
 if(messageChannel)db.removeChannel(messageChannel);
 messageChannel=db.channel("messages-"+currentUser.id)
  .on("postgres_changes",{
   event:"*",schema:"public",table:"messages"
  },async payload=>{
   const m=payload.new||payload.old;
   if(!m)return;
   if(m.sender_id===currentUser.id||m.receiver_id===currentUser.id){
    await loadUsers();
    if(selectedUser&&
     (m.sender_id===selectedUser.id||m.receiver_id===selectedUser.id)){
     await loadMessages();
     if(m.receiver_id===currentUser.id)await markMessagesRead();
    }
   }
  }).subscribe();
}

function startPresence(){
 if(presenceChannel)db.removeChannel(presenceChannel);
 presenceChannel=db.channel("t-world-presence",{config:{presence:{key:currentUser.id}}});
 presenceChannel.on("presence",{event:"sync"},()=>{
  const state=presenceChannel.presenceState();
  onlineUsers=new Set(Object.keys(state));
  loadUsers();
 }).subscribe(async status=>{
  if(status==="SUBSCRIBED"){
   await presenceChannel.track({online:true});
  }
 });
}

function startTyping(){
 if(typingChannel)db.removeChannel(typingChannel);
 typingChannel=db.channel("typing-"+selectedUser.id+"-"+currentUser.id);
 typingChannel.on("broadcast",{event:"typing"},({payload})=>{
  el("typing").textContent=payload.userId===selectedUser?.id?
   payload.name+" is typing...":"";
 });
 typingChannel.subscribe();
}

el("chatInput").addEventListener("input",()=>{
 if(!selectedUser||!typingChannel)return;
 typingChannel.send({
  type:"broadcast",event:"typing",
  payload:{userId:currentUser.id,name:myProfile.full_name||"Someone"}
 });
 clearTimeout(typingTimer);
 typingTimer=setTimeout(()=>el("typing").textContent="",1800);
});

function startHeartbeat(){
 clearInterval(heartbeat);
 const update=()=>db.from("profiles")
  .update({last_seen:new Date().toISOString()}).eq("id",currentUser.id);
 update();
 heartbeat=setInterval(update,60000);
}

async function logout(){
 if(mediaRecorder&&mediaRecorder.state==="recording")mediaRecorder.stop();
 if(recordingStream)recordingStream.getTracks().forEach(t=>t.stop());
 clearInterval(heartbeat);
 if(presenceChannel)await db.removeChannel(presenceChannel);
 if(messageChannel)await db.removeChannel(messageChannel);
 if(typingChannel)await db.removeChannel(typingChannel);
 await db.auth.signOut();
 currentUser=null;
 selectedUser=null;
 el("appPanel").classList.add("hidden");
 el("authPanel").classList.remove("hidden");
 el("chatPanel").classList.add("hidden");
 authMessage("You have logged out.");
}

async function restoreSession(){
 const {data}=await db.auth.getSession();
 if(data.session){
  currentUser=data.session.user;
  try{await startApp()}catch(e){say("App error: "+e.message)}
 }
}

restoreSession();
</script>
</body>
</html>
