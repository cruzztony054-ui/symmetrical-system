
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T-WORLD Private Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080d18;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #121c2e;
  padding: 20px;
  text-align: center;
  color: #38d9a9;
  font-size: 25px;
  font-weight: bold;
}

.container {
  max-width: 550px;
  margin: 20px auto;
  padding: 18px;
}

.card {
  background: #121c2e;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 15px;
}

h2 { color: #38d9a9; }

input, button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: none;
  border-radius: 8px;
  font-size: 15px;
}

input {
  background: #263449;
  color: white;
}

button {
  background: #38d9a9;
  color: #07130f;
  font-weight: bold;
  cursor: pointer;
}

.secondary {
  background: #263449;
  color: white;
}

.hidden { display: none !important; }

.user {
  background: #263449;
  padding: 14px;
  border-radius: 9px;
  margin: 8px 0;
  cursor: pointer;
}

.user:hover { background: #35465e; }

#messages {
  height: 350px;
  overflow-y: auto;
  padding: 10px;
  background: #080d18;
  border-radius: 10px;
}

.message {
  padding: 12px;
  border-radius: 12px;
  margin: 8px 0;
  max-width: 85%;
  overflow-wrap: anywhere;
}

.sent {
  background: #087e62;
  margin-left: auto;
}

.received {
  background: #263449;
  margin-right: auto;
}

.small {
  color: #aab5c5;
  font-size: 12px;
}

#status {
  color: #38d9a9;
  text-align: center;
  margin: 12px 0;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<header>T-WORLD</header>

<div class="container">

<div id="authSection" class="card">
  <h2>Welcome to T-WORLD</h2>
  <p>Your private messaging space.</p>

  <div id="registerFields" class="hidden">
    <input id="fullName" placeholder="Your full name">
    <input id="username" placeholder="Choose a username">
  </div>

  <input id="email" type="email" placeholder="Email address">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button class="secondary" onclick="register()">Create Account</button>
  <button class="secondary" onclick="forgotPassword()">Forgot Password?</button>

  <p id="status"></p>
</div>

<div id="appSection" class="hidden">

  <div class="card">
    <h2 id="welcome">Welcome!</h2>
    <p>Find people and start conversations.</p>
    <button class="secondary" onclick="logout()">Log Out</button>
  </div>

  <div id="homeSection" class="card">
    <h2>Find People</h2>
    <input
      id="search"
      placeholder="Search by username..."
      oninput="searchUsers()"
    >
    <div id="searchResults"></div>

    <h2>Your Conversations</h2>
    <div id="conversationList"></div>
  </div>

  <div id="chatSection" class="card hidden">
    <button class="secondary" onclick="goHome()">← Back</button>

    <h2 id="chatName">Conversation</h2>

    <div id="messages"></div>

    <input id="messageInput" placeholder="Write a message...">

    <button onclick="sendMessage()">Send Message</button>
  </div>

</div>

</div>

<script>
const SUPABASE_URL =
"https://szlsitwlvlcohcodhazu.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_4t9X38e8lhJuwTB3KpaEfg_jfYwLcPS";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let currentUser = null;
let myProfile = null;
let activeChatUser = null;
let messageSubscription = null;
let searchTimer = null;

function showStatus(message) {
  document.getElementById("status").textContent = message;
}

function escapeText(value) {
  return String(value ?? "");
}

function showRegister() {
  document.getElementById("registerFields")
    .classList.toggle("hidden");
}

async function register() {
  const fullName =
    document.getElementById("fullName").value.trim();

  const username =
    document.getElementById("username").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!fullName || !username || !email || !password) {
    showStatus("Fill in all registration fields.");
    return;
  }

  if (password.length < 8) {
    showStatus("Password must be at least 8 characters.");
    return;
  }

  showStatus("Creating your account...");

  const { data, error } = await db.auth.signUp({
    email,
    password,
    options: {
      data: {
        full_name: fullName,
        username: username
      }
    }
  });

  if (error) {
    showStatus(error.message);
    return;
  }

  if (!data.session) {
    showStatus("Account created! Check your email to confirm, then log in.");
    return;
  }

  await enterApp(data.user);
}

async function login() {
  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {
    showStatus("Enter your email and password.");
    return;
  }

  showStatus("Logging in...");

  const { data, error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    showStatus(error.message);
    return;
  }

  await enterApp(data.user);
}

async function enterApp(user) {
  currentUser = user;

  const { data, error } = await db
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .maybeSingle();

  if (error) {
    showStatus("Profile error: " + error.message);
    return;
  }

  myProfile = data;

  if (!myProfile) {
    showStatus("Your profile is missing. Please contact support.");
    return;
  }

  document.getElementById("authSection")
    .classList.add("hidden");

  document.getElementById("appSection")
    .classList.remove("hidden");

  document.getElementById("welcome").textContent =
    "Welcome, " + myProfile.full_name;

  await refreshHome();
}

async function searchUsers() {
  clearTimeout(searchTimer);

  searchTimer = setTimeout(async () => {
    const term =
      document.getElementById("search").value.trim();

    const results =
      document.getElementById("searchResults");

    results.innerHTML = "";

    if (term.length < 2) return;

    const { data, error } = await db
      .from("profiles")
      .select("id, full_name, username")
      .ilike("username", "%" + term + "%")
      .neq("id", currentUser.id)
      .limit(20);

    if (error) {
      results.textContent = error.message;
      return;
    }

    if (!data.length) {
      results.textContent = "No users found.";
      return;
    }

    data.forEach(profile => {
      const item = document.createElement("div");
      item.className = "user";

      const name = document.createElement("strong");
      name.textContent = profile.full_name;

      const username = document.createElement("div");
      username.className = "small";
      username.textContent = "@" + profile.username;

      item.append(name, username);

      item.onclick = () => openChat(profile);

      results.appendChild(item);
    });
  }, 400);
}

async function refreshHome() {
  const { data, error } = await db
    .from("messages")
    .select("sender_id, receiver_id, created_at")
    .or(
      "sender_id.eq." + currentUser.id +
      ",receiver_id.eq." + currentUser.id
    )
    .order("created_at", { ascending: false })
    .limit(100);

  if (error) {
    document.getElementById("conversationList").textContent =
      error.message;
    return;
  }

  const otherIds = [...new Set(
    data.map(message =>
      message.sender_id === currentUser.id
        ? message.receiver_id
        : message.sender_id
    )
  )];

  const list =
    document.getElementById("conversationList");

  list.innerHTML = "";

  if (!otherIds.length) {
    list.textContent = "No conversations yet. Search for someone!";
    return;
  }

  const { data: profiles, error: profileError } = await db
    .from("profiles")
    .select("id, full_name, username")
    .in("id", otherIds);

  if (profileError) {
    list.textContent = profileError.message;
    return;
  }

  profiles.forEach(profile => {
    const item = document.createElement("div");
    item.className = "user";
    item.textContent =
      profile.full_name + " (@" + profile.username + ")";

    item.onclick = () => openChat(profile);

    list.appendChild(item);
  });
}

async function openChat(profile) {
  activeChatUser = profile;

  document.getElementById("homeSection")
    .classList.add("hidden");

  document.getElementById("chatSection")
    .classList.remove("hidden");

  document.getElementById("chatName").textContent =
    profile.full_name + " (@" + profile.username + ")";

  await loadMessages();

  if (messageSubscription) {
    await db.removeChannel(messageSubscription);
  }

  messageSubscription = db
    .channel("chat-" + currentUser.id + "-" + profile.id)
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "messages"
      },
      payload => {
        const msg = payload.new;

        const belongsToChat =
          (msg.sender_id === currentUser.id &&
           msg.receiver_id === activeChatUser?.id) ||
          (msg.sender_id === activeChatUser?.id &&
           msg.receiver_id === currentUser.id);

        if (belongsToChat) {
          loadMessages();
        }
      }
    )
    .subscribe();
}

async function loadMessages() {
  if (!activeChatUser) return;

  const { data, error } = await db
    .from("messages")
    .select("*")
    .or(
      "and(sender_id.eq." + currentUser.id +
      ",receiver_id.eq." + activeChatUser.id +
      "),and(sender_id.eq." + activeChatUser.id +
      ",receiver_id.eq." + currentUser.id + ")"
    )
    .order("created_at", { ascending: true });

  const box = document.getElementById("messages");

  if (error) {
    box.textContent = error.message;
    return;
  }

  box.innerHTML = "";

  data.forEach(msg => {
    const item = document.createElement("div");

    item.className =
      "message " +
      (msg.sender_id === currentUser.id
        ? "sent"
        : "received");

    item.textContent = msg.content;

    box.appendChild(item);
  });

  box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
  const input =
    document.getElementById("messageInput");

  const content = input.value.trim();

  if (!content || !activeChatUser) return;

  const { error } = await db
    .from("messages")
    .insert({
      sender_id: currentUser.id,
      receiver_id: activeChatUser.id,
      content: content
    });

  if (error) {
    alert(error.message);
    return;
  }

  input.value = "";

  await loadMessages();
  await refreshHome();
}

function goHome() {
  if (messageSubscription) {
    db.removeChannel(messageSubscription);
    messageSubscription = null;
  }

  activeChatUser = null;

  document.getElementById("chatSection")
    .classList.add("hidden");

  document.getElementById("homeSection")
    .classList.remove("hidden");

  refreshHome();
}

async function forgotPassword() {
  const email =
    document.getElementById("email").value.trim();

  if (!email) {
    showStatus("Enter your email address first.");
    return;
  }

  const base = window.location.href.replace(/index\.html(\?.*)?$/, "");

  const { error } = await db.auth.resetPasswordForEmail(
    email,
    {
      redirectTo: base + "reset-password.html"
    }
  );

  if (error) {
    showStatus(error.message);
    return;
  }

  showStatus("Password reset email sent. Check your inbox.");
}

async function logout() {
  if (messageSubscription) {
    await db.removeChannel(messageSubscription);
    messageSubscription = null;
  }

  await db.auth.signOut();

  currentUser = null;
  myProfile = null;
  activeChatUser = null;

  document.getElementById("appSection")
    .classList.add("hidden");

  document.getElementById("authSection")
    .classList.remove("hidden");
}

async function initialize() {
  const { data, error } = await db.auth.getSession();

  if (error) {
    showStatus(error.message);
    return;
  }

  if (data.session) {
    await enterApp(data.session.user);
  }
}

initialize();
</script>

</body>
</html>
